<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SST Compliance Suite · Painel de Gestão Multiempresa</title>
<meta name="description" content="Sistema de gestão de SST para consultoria: GRO/PGR (NR-01), ISO 45001, documentos, não conformidades, auditorias, treinamentos e KPIs de múltiplas empresas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS (mesmo sistema visual do site principal) ============ */
:root{
  --paper:#F4F7F5; --paper-raised:#FFFFFF; --paper-sunken:#E9EFEC;
  --ink:#132420; --ink-soft:#4B5B55; --ink-faint:#7C8B85;
  --line:#D7E1DC; --line-strong:#B9C8C1;
  --teal-700:#0B5A4E; --teal-600:#0F7A68; --teal-500:#159A82; --teal-100:#DCEEE8;
  --amber-700:#8A5A0B; --amber-600:#B4740E; --amber-100:#F8E9CF;
  --green-700:#1F6B45; --green-600:#2E7D53; --green-100:#E1F0E6;
  --red-700:#8C2E2E; --red-600:#B23A3A; --red-100:#F8E6E6;
  --focus:#0F7A68;
  --shadow: 0 1px 2px rgba(19,36,32,.06), 0 6px 16px -8px rgba(19,36,32,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1613; --paper-raised:#141F1B; --paper-sunken:#0A100E;
    --ink:#E7F1EC; --ink-soft:#AFC2BB; --ink-faint:#7C9089;
    --line:#233531; --line-strong:#31473F;
    --teal-700:#6FD3B9; --teal-600:#49BFA0; --teal-500:#2EA98A; --teal-100:#12332B;
    --amber-700:#F0C374; --amber-600:#D89A3D; --amber-100:#2E2411;
    --green-700:#8FDBAE; --green-600:#5CBE8A; --green-100:#12301F;
    --red-700:#F0A3A3; --red-600:#DD7373; --red-100:#341717;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1613; --paper-raised:#141F1B; --paper-sunken:#0A100E;
  --ink:#E7F1EC; --ink-soft:#AFC2BB; --ink-faint:#7C9089;
  --line:#233531; --line-strong:#31473F;
  --teal-700:#6FD3B9; --teal-600:#49BFA0; --teal-500:#2EA98A; --teal-100:#12332B;
  --amber-700:#F0C374; --amber-600:#D89A3D; --amber-100:#2E2411;
  --green-700:#8FDBAE; --green-600:#5CBE8A; --green-100:#12301F;
  --red-700:#F0A3A3; --red-600:#DD7373; --red-100:#341717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{background:var(--paper); color:var(--ink);}
body{margin:0; font-family:"Source Serif 4",Georgia,serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.ui{font-family:"Archivo","Helvetica Neue",Arial,sans-serif; text-wrap:balance;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--teal-700);}
::selection{background:var(--teal-100); color:var(--teal-700);}
:focus-visible{outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px;}
button{font:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:inherit; color:var(--ink);}

/* ============ SHELL ============ */
.app-shell{display:grid; grid-template-columns:264px 1fr; grid-template-rows:64px 1fr; min-height:100vh;}
.topbar{grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:0 20px; border-bottom:1px solid var(--line); background:var(--paper-raised); position:sticky; top:0; z-index:40;}
.topbar .brand{display:flex; align-items:center; gap:10px; min-width:0;}
.topbar .brand .mark{width:32px;height:32px;border-radius:9px;background:var(--teal-700); color:#fff; display:grid; place-items:center; flex:none; font-family:Archivo; font-weight:800; font-size:.72rem;}
.topbar .brand .name{font-family:Archivo; font-weight:700; font-size:.98rem; white-space:nowrap;}
.topbar .brand .sub{font-size:.72rem; color:var(--ink-faint); font-family:Archivo; font-weight:500; white-space:nowrap;}
.topbar .spacer{flex:1;}
.menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:8px; width:36px; height:36px; align-items:center; justify-content:center; color:var(--ink); flex:none;}
.company-switcher{display:flex; align-items:center; gap:8px;}
.company-switcher label{font-family:Archivo; font-weight:700; font-size:.66rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.company-switcher select{border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; background:var(--paper-raised); color:var(--ink); font-family:Archivo; font-weight:600; font-size:.82rem; max-width:230px;}
.theme-btn{background:none; border:1px solid var(--line); border-radius:8px; width:36px; height:36px; display:grid; place-items:center; color:var(--ink); flex:none;}

.sidebar{border-right:1px solid var(--line); background:var(--paper-raised); padding:16px 10px 32px; overflow-y:auto; position:sticky; top:64px; height:calc(100vh - 64px);}
.side-group-title{font-family:Archivo; font-weight:700; font-size:.65rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); padding:14px 10px 6px;}
.side-group-title:first-child{padding-top:2px;}
.side-link{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none; padding:9px 10px; border-radius:9px; color:var(--ink-soft); font-family:Archivo; font-weight:600; font-size:.85rem; margin-bottom:2px;}
.side-link .ic{flex:none; width:19px; text-align:center;}
.side-link .label{flex:1; min-width:0;}
.side-link .badge{flex:none; font-family:"IBM Plex Mono"; font-size:.66rem; font-weight:600; padding:1px 6px; border-radius:99px; background:var(--red-100); color:var(--red-700);}
.side-link:hover{background:var(--paper-sunken); color:var(--ink);}
.side-link.active{background:var(--teal-100); color:var(--teal-700);}

main.content{padding:28px 32px 90px; max-width:1180px;}
.view{display:none;}
.view.active{display:block; animation:fade .22s ease;}
@media (prefers-reduced-motion:reduce){.view.active{animation:none;}}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

.kicker{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.pill{font-family:Archivo; font-weight:700; font-size:.66rem; letter-spacing:.05em; padding:3px 9px; border-radius:99px; text-transform:uppercase;}
.pill.teal{background:var(--teal-100); color:var(--teal-700);}
.pill.amber{background:var(--amber-100); color:var(--amber-700);}
.pill.green{background:var(--green-100); color:var(--green-700);}
.pill.red{background:var(--red-100); color:var(--red-700);}

h1.page-title{font-size:1.7rem; font-weight:800; margin:0 0 4px; letter-spacing:-.01em;}
p.lede{font-size:.98rem; color:var(--ink-soft); max-width:74ch; margin:0 0 22px;}
h2.sec{font-size:1.12rem; font-weight:700; margin:30px 0 12px; padding-top:6px; border-top:1px solid var(--line);}
h2.sec:first-of-type{border-top:none; padding-top:0;}
h3.sub{font-size:.96rem; font-weight:700; margin:18px 0 8px; color:var(--teal-700);}
p{max-width:74ch;}

.card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);}
.callout{border-radius:12px; padding:14px 16px; margin:16px 0; border:1px solid var(--line); display:flex; gap:11px; max-width:80ch;}
.callout .ic{flex:none; font-size:1.05rem; line-height:1.4;}
.callout.legal{background:var(--teal-100); border-color:var(--teal-500);}
.callout.warn{background:var(--amber-100); border-color:var(--amber-600);}
.callout p,.callout div{margin:0;}
.callout .t{font-family:Archivo; font-weight:700; font-size:.8rem; margin-bottom:3px;}
.callout.legal .t{color:var(--teal-700);}
.callout.warn .t{color:var(--amber-700);}

table{border-collapse:collapse; width:100%; font-size:.86rem;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; margin:14px 0 24px; background:var(--paper-raised);}
table th{text-align:left; font-family:Archivo; font-weight:700; font-size:.68rem; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); background:var(--paper-sunken); padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
table td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
table tr:last-child td{border-bottom:none;}
table td.code{font-family:"IBM Plex Mono"; font-size:.76rem; color:var(--teal-700); white-space:nowrap;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.btn{font-family:Archivo; font-weight:700; font-size:.82rem; border-radius:10px; border:1px solid transparent; padding:9px 15px; display:inline-flex; align-items:center; gap:7px;}
.btn.primary{background:var(--teal-700); color:#fff;}
.btn.primary:hover{background:var(--teal-600);}
.btn.ghost{background:var(--paper-raised); border-color:var(--line-strong); color:var(--ink);}
.btn.ghost:hover{background:var(--paper-sunken);}
.btn.small{padding:6px 11px; font-size:.74rem; border-radius:8px;}

/* KPI cards */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:8px;}
.kpi-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);}
.kpi-card .label{font-family:Archivo; font-weight:700; font-size:.66rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); display:flex; justify-content:space-between; gap:6px;}
.kpi-card .value{font-family:"IBM Plex Mono"; font-weight:600; font-size:1.7rem; margin:6px 0 2px; color:var(--ink); line-height:1;}
.kpi-card .value .unit{font-size:.9rem; color:var(--ink-faint); margin-left:2px;}
.kpi-card .note{font-size:.74rem; color:var(--ink-soft); font-family:Archivo;}
.kpi-card .spark{margin-top:8px; display:block;}

.status-badge{display:inline-flex; align-items:center; gap:5px; font-family:Archivo; font-weight:700; font-size:.68rem; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap;}
.status-badge.good{background:var(--green-100); color:var(--green-700);}
.status-badge.warn{background:var(--amber-100); color:var(--amber-700);}
.status-badge.bad{background:var(--red-100); color:var(--red-700);}
.status-badge.crit{background:var(--red-600); color:#fff;}
.status-badge.neutral{background:var(--paper-sunken); color:var(--ink-soft);}

.bar-row{display:grid; grid-template-columns:150px 1fr 54px; gap:10px; align-items:center; margin-bottom:9px; font-size:.82rem;}
.bar-row .lbl{font-family:Archivo; font-weight:600; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{height:9px; border-radius:99px; background:var(--paper-sunken); overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:99px;}
.bar-row .val{font-family:"IBM Plex Mono"; font-weight:600; text-align:right; font-size:.8rem;}
.fill-good{background:linear-gradient(90deg,var(--green-600),var(--green-700));}
.fill-warn{background:linear-gradient(90deg,var(--amber-600),var(--amber-700));}
.fill-bad{background:linear-gradient(90deg,var(--red-600),var(--red-700));}
.fill-teal{background:linear-gradient(90deg,var(--teal-500),var(--teal-700));}

.gauge-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.gauge-num{font-family:"IBM Plex Mono"; font-weight:600; font-size:1.05rem;}

.tab-row{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); overflow-x:auto;}
.tab-btn{padding:9px 13px; font-family:Archivo; font-weight:700; font-size:.8rem; color:var(--ink-faint); border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--teal-700); border-color:var(--teal-700);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.alert-item{display:flex; gap:11px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--paper-raised);}
.alert-item.crit{border-color:var(--red-600); background:var(--red-100);}
.alert-item.warn{border-color:var(--amber-600); background:var(--amber-100);}
.alert-item .ic{flex:none;}
.alert-item .t{font-family:Archivo; font-weight:700; font-size:.84rem;}
.alert-item .d{font-size:.8rem; color:var(--ink-soft);}

select.status-select{border:1px solid var(--line-strong); border-radius:8px; padding:5px 8px; background:var(--paper-raised); color:var(--ink); font-family:Archivo; font-weight:600; font-size:.76rem;}

.co-card{border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:var(--paper-raised); box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s;}
.co-card:hover{border-color:var(--teal-500);}
.co-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.co-card .nm{font-family:Archivo; font-weight:700; font-size:.98rem;}
.co-card .meta{font-size:.78rem; color:var(--ink-faint);}
.co-card .score{font-family:"IBM Plex Mono"; font-weight:600; font-size:1.5rem;}

.legend-row{display:flex; gap:16px; flex-wrap:wrap; margin:10px 0 4px; font-size:.78rem; font-family:Archivo; font-weight:600; color:var(--ink-soft);}
.legend-row .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;}

.footnote{font-size:.76rem; color:var(--ink-faint); margin-top:22px; border-top:1px solid var(--line); padding-top:12px; max-width:80ch;}

@media (max-width:900px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed; left:0; top:64px; bottom:0; width:264px; transform:translateX(-100%); transition:transform .2s; z-index:50;}
  .sidebar.open{transform:translateX(0); box-shadow:8px 0 24px rgba(0,0,0,.2);}
  .menu-btn{display:flex;}
  main.content{padding:22px 16px 90px;}
  .company-switcher select{max-width:150px;}
}
@media print{
  .sidebar,.topbar,.menu-btn,.tab-row,.btn,select.status-select{display:none !important;}
  main.content{padding:0; max-width:100%;}
  .app-shell{display:block;}
  .view{display:block !important;}
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
    <div class="brand">
      <div class="mark">SST</div>
      <div style="min-width:0;">
        <div class="name">SST Compliance Suite</div>
        <div class="sub">NR‑01 · ISO 45001 · Multiempresa</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="company-switcher" id="companySwitcherWrap">
      <label for="companySelect">Empresa</label>
      <select id="companySelect"></select>
    </div>
    <button class="btn ghost small" id="addCoBtn" title="Cadastrar nova empresa-cliente">+ Empresa</button>
    <button class="theme-btn" id="themeBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="side-group-title">Consultoria</div>
    <button class="side-link" data-view="overview"><span class="ic">🏢</span><span class="label">Visão geral (carteira)</span></button>
    <button class="side-link" data-view="settings"><span class="ic">⚙️</span><span class="label">Empresas &amp; config.</span></button>

    <div class="side-group-title">Empresa selecionada</div>
    <button class="side-link" data-view="dashboard"><span class="ic">📊</span><span class="label">Dashboard</span></button>
    <button class="side-link" data-view="gro"><span class="ic">🧭</span><span class="label">NR‑01 · GRO/PGR</span></button>
    <button class="side-link" data-view="iso"><span class="ic">📘</span><span class="label">ISO 45001</span></button>
    <button class="side-link" data-view="docs"><span class="ic">📄</span><span class="label">Documentos</span></button>
    <button class="side-link" data-view="nc"><span class="ic">🚩</span><span class="label">NC &amp; Plano de ação</span></button>
    <button class="side-link" data-view="audits"><span class="ic">🔍</span><span class="label">Auditorias</span></button>
    <button class="side-link" data-view="training"><span class="ic">🎓</span><span class="label">Treinamentos &amp; ASO</span></button>
    <button class="side-link" data-view="kpis"><span class="ic">📈</span><span class="label">Indicadores (KPIs)</span></button>
  </nav>

  <main class="content" id="content"></main>
</div>

<script>
/* =========================================================================
   SST COMPLIANCE SUITE
   Sistema de gestão de SST multiempresa para consultoria — front-end
   autocontido (sem backend): dados de demonstração + persistência local
   (localStorage) das edições feitas na sessão do navegador.
   Cobertura normativa: NR‑01 (GRO/PGR) e ISO 45001 (cláusulas 4‑10).
   ========================================================================= */

const STORAGE_KEY = 'sst_suite_v1';
const DAY = 86400000;
const today = new Date(); today.setHours(0,0,0,0);

function addDays(n){ return new Date(today.getTime() + n*DAY); }
function fmtDate(d){ d = (d instanceof Date) ? d : new Date(d); return d.toLocaleDateString('pt-BR'); }
function daysUntil(d){ d = (d instanceof Date) ? d : new Date(d); d = new Date(d); d.setHours(0,0,0,0); return Math.round((d - today)/DAY); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function pct(v){ return Math.round(v) + '%'; }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

/* ---------- Escala de status por limiar (reutiliza tokens: bom/atenção/crítico) ---------- */
function scoreStatus(v){ return v>=80?'good' : v>=50?'warn' : 'bad'; }
function scoreFill(v){ return v>=80?'fill-good' : v>=50?'fill-warn' : 'fill-bad'; }
function docStatus(days){ return days<0?'bad' : days<=30?'warn' : 'good'; }
function docLabel(days){ return days<0? `Vencido há ${Math.abs(days)}d` : days<=30? `Vence em ${days}d` : `Válido (${days}d)`; }
function riskBadge(level){
  const map = {'Baixo':'good','Médio':'warn','Alto':'bad','Crítico':'crit'};
  return `<span class="status-badge ${map[level]||'neutral'}">${level==='Crítico'?'⛔ ':''}${level}</span>`;
}
function ncSeverityColor(sev){ return {'Baixa':'good','Média':'warn','Alta':'bad','Crítica':'crit'}[sev] || 'neutral'; }

/* ============================= DADOS DE DEMONSTRAÇÃO ============================= */
function seedData(){
  return {
    activeCompany: 'c1',
    companies: [
      company({
        id:'c1', name:'Aço Vetor Metalurgia Ltda', cnpj:'12.345.678/0001-90', sector:'Metalurgia', nr4:3, employees:210,
        tf:18.4, tg:210, asoCompliance:96, epiCompliance:94, legalCompliance:91, hht:420000,
        ghes:[
          ghe('Solda e corte a plasma','Físico (ruído, calor); Químico (fumos metálicos); Mecânico','Alto','Ventilação local exaustora instalada; uso de EPI respiratório obrigatório','Em controle'),
          ghe('Prensa e conformação mecânica','Mecânico (prensagem); Ergonômico (esforço repetitivo)','Crítico','Falta enclausuramento total da prensa nº 3; dispositivo de segurança parcial','Ação pendente'),
          ghe('Almoxarifado e logística interna','Mecânico (movimentação de cargas, empilhadeira)','Médio','Sinalização de rotas e treinamento de operadores em dia','Controlado'),
          ghe('Administrativo/escritório','Ergonômico (postura, mobiliário)','Baixo','Análise ergonômica preliminar realizada','Controlado'),
        ],
        actionPlan:[
          action('Enclausurar prensa nº 3 (guarda de segurança)','Prensa e conformação mecânica','Engenharia (Eng. de Segurança)',-10,'Atrasado'),
          action('Trocar EPI respiratório PFF2 por PFF3 no setor de solda','Solda e corte a plasma','SESMT',20,'Em andamento'),
          action('Revisar LTCAT com dados atualizados de ruído','Solda e corte a plasma','Higienista Ocupacional',45,'Pendente'),
          action('Instalar sensor de presença na prensa nº 3','Prensa e conformação mecânica','Manutenção',-3,'Atrasado'),
          action('Treinamento NR‑12 de reciclagem','Prensa e conformação mecânica','RH/SESMT',12,'Em andamento'),
        ],
        iso:{4:70,5:65,6:60,7:75,8:55,9:60,10:58},
        legal:[
          legal('NR‑01','GRO/PGR','Parcial'),
          legal('NR‑04','SESMT dimensionado','Conforme'),
          legal('NR‑05','CIPA constituída e em mandato','Conforme'),
          legal('NR‑06','Ficha de EPI assinada e CA válido','Conforme'),

let DB = load();
let state = { view:'overview', tab:{} };

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const d = seedData();
  save(d);
  return d;
}
function save(d){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d||DB)); }catch(e){} }
function resetDemo(){ if(confirm('Restaurar todos os dados de demonstração? Edições feitas na sessão serão perdidas.')){ DB = seedData(); save(); state.view='overview'; render(); } }

function activeCo(){ return getCompany(DB.activeCompany) || DB.companies[0]; }

/* ============================= KPIs DERIVADOS ============================= */
function computeKPIs(co){
  const ghesOpen = co.ghes.filter(g=>['Alto','Crítico'].includes(g.riskLevel) && g.status!=='Controlado').length;
  const groControlled = co.ghes.filter(g=>g.status==='Controlado').length;
  const groScore = co.ghes.length ? Math.round(100*groControlled/co.ghes.length) : 100;

  const actionsTotal = co.actionPlan.length;
  const actionsLate = co.actionPlan.filter(a=>a.status==='Atrasado' || (a.due<0 && a.status!=='Concluído')).length;
  const actionsDone = co.actionPlan.filter(a=>a.status==='Concluído').length;
  const actionsOnTime = actionsTotal ? Math.round(100*(actionsTotal-actionsLate)/actionsTotal) : 100;

  const isoVals = Object.values(co.iso);
  const isoScore = isoVals.length ? Math.round(isoVals.reduce((a,b)=>a+b,0)/isoVals.length) : 0;

  const docsTotal = co.documents.length;
  const docsOverdue = co.documents.filter(d=>d.due<0).length;
  const docsScore = docsTotal ? Math.round(100*(docsTotal-docsOverdue)/docsTotal) : 100;

  const ncOpen = co.ncs.filter(n=>n.status!=='Concluída' && n.status!=='Fechada').length;
  const ncOverdue = co.ncs.filter(n=>n.due<0 && n.status!=='Concluída' && n.status!=='Fechada').length;
  const ncCritical = co.ncs.filter(n=>n.severity==='Crítica' && n.status!=='Concluída').length;

  const trainingScore = co.trainings.length ? Math.round(100*co.trainings.reduce((s,t)=>s+(t.completed/t.total),0)/co.trainings.length) : 100;

  // Score geral ponderado: GRO 20% · ISO 25% · Documentos 20% · Treinamento 15% · Ações no prazo 20%
  const overall = Math.round(groScore*0.20 + isoScore*0.25 + docsScore*0.20 + trainingScore*0.15 + actionsOnTime*0.20);

  return { ghesOpen, groScore, actionsTotal, actionsLate, actionsDone, actionsOnTime, isoScore,
    docsTotal, docsOverdue, docsScore, ncOpen, ncOverdue, ncCritical, trainingScore, overall };
}

/* ============================= HELPERS DE UI (SVG/BARRAS) ============================= */
function barRow(label, value, opts){
  opts = opts||{};
  const max = opts.max ?? 100;
  const fillClass = opts.fillClass || scoreFill(value);
  const suffix = opts.suffix ?? '%';
  const w = clamp(100*value/max, 2, 100);
  return `<div class="bar-row">
    <div class="lbl" title="${label}">${label}</div>
    <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${w}%"></div></div>
    <div class="val">${opts.display ?? (Math.round(value*10)/10 + suffix)}</div>
  </div>`;
}

function sparkSVG(values, colorVar, w=140, h=34){
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = (i/(values.length-1))*(w-4)+2;
    const y = h-2-((v-min)/span)*(h-4);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Tendência dos últimos 6 meses">
    <path d="${path}" fill="none" stroke="${colorVar}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${colorVar}"/>
  </svg>`;
}

function gaugeSVG(value, size=104){
  const r = size/2 - 9, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const frac = clamp(value,0,100)/100;
  const status = scoreStatus(value);
  const color = status==='good' ? 'var(--green-600)' : status==='warn' ? 'var(--amber-600)' : 'var(--red-600)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Score geral de compliance ${Math.round(value)} por cento">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--paper-sunken)" stroke-width="9"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-frac)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+2}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono" font-weight="600" font-size="${size*0.22}" fill="var(--ink)">${Math.round(value)}%</text>
  </svg>`;
}

function kpiCard({label, value, unit, note, spark, tooltip}){
  return `<div class="kpi-card" ${tooltip?`title="${tooltip}"`:''}>
    <div class="label"><span>${label}</span></div>
    <div class="value">${value}${unit?`<span class="unit">${unit}</span>`:''}</div>
    ${note?`<div class="note">${note}</div>`:''}
    ${spark?spark:''}
  </div>`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const avgScore = Math.round(withK.reduce((s,x)=>s+x.k.overall,0)/withK.length);
  const totalEmp = cos.reduce((s,c)=>s+c.employees,0);
  const totalNCOpen = withK.reduce((s,x)=>s+x.k.ncOpen,0);
  const totalNCOverdue = withK.reduce((s,x)=>s+x.k.ncOverdue,0);
  const critCos = withK.filter(x=>x.k.overall<50).length;

  // alertas de vencimento cross-empresa
  let alerts = [];
  withK.forEach(({c})=>{
    c.documents.forEach(d=>{ if(d.due<=30) alerts.push({co:c.name, label:d.type, due:d.due, kind:'doc'}); });
    c.actionPlan.forEach(a=>{ if((a.due<=7 || a.status==='Atrasado') && a.status!=='Concluído') alerts.push({co:c.name, label:'Ação: '+a.measure, due:a.due, kind:'action'}); });
  });
  alerts.sort((a,b)=>a.due-b.due);

  const ranking = withK.slice().sort((a,b)=>b.k.overall-a.k.overall);

  return `

    ${kpiCard({label:'Colaboradores cobertos', value:totalEmp.toLocaleString('pt-BR')})}
    ${kpiCard({label:'Score médio de compliance', value:avgScore, unit:'%', note: avgScore>=80?'Carteira saudável':avgScore>=50?'Atenção em parte da carteira':'Ação urgente necessária'})}
    ${kpiCard({label:'Empresas em situação crítica', value:critCos, note:'Score geral < 50%'})}
    ${kpiCard({label:'NC abertas na carteira', value:totalNCOpen, note: totalNCOverdue+' atrasada(s)'})}
  </div>

  <h2 class="sec">Ranking de compliance por empresa</h2>
  <div class="card">
    ${ranking.map(({c,k})=>barRow(c.name, k.overall, {suffix:'%'})).join('')}
  </div>
  <div class="legend-row">
    <span><span class="sw" style="background:var(--green-600)"></span>≥ 80% conforme</span>
    <span><span class="sw" style="background:var(--amber-600)"></span>50–79% atenção</span>
    <span><span class="sw" style="background:var(--red-600)"></span>&lt; 50% crítico</span>
  </div>

  <h2 class="sec">Empresas</h2>
  <div class="grid-3">
    ${cos.map(c=>{
      const k = computeKPIs(c);
      return `<div class="co-card" data-goto-company="${c.id}">
        <div class="top">
          <div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(c.sector)} · GR${c.nr4} · ${c.employees} colab.</div></div>
          <div class="score" style="color:${k.overall>=80?'var(--green-700)':k.overall>=50?'var(--amber-700)':'var(--red-700)'}">${k.overall}%</div>
        </div>
        <div class="legend-row" style="margin:6px 0 0;">
          <span class="status-badge ${k.ncOverdue>0?'bad':'good'}">${k.ncOverdue} NC atrasada(s)</span>
          <span class="status-badge ${k.ghesOpen>0?'warn':'good'}">${k.ghesOpen} risco(s) crítico(s) aberto(s)</span>
        </div>
      </div>`;
    }).join('')}
  </div>

  <h2 class="sec">Alertas de vencimento (documentos e ações — próximos 30 dias / atrasados)</h2>
  <div>
    ${alerts.length===0?'<p class="lede">Nenhum alerta no momento. ✅</p>':alerts.slice(0,12).map(a=>`
      <div class="alert-item ${a.due<0?'crit':'warn'}">
        <span class="ic">${a.due<0?'⛔':'⏳'}</span>
        <div>
          <div class="t">${esc(a.co)} — ${esc(a.label)}</div>
          <div class="d">${docLabel(a.due)}</div>
        </div>
      </div>`).join('')}
    ${alerts.length>12?`<p class="footnote">+ ${alerts.length-12} outros alertas na carteira.</p>`:''}
  </div>

  <div class="footnote">Sistema de referência para gestão de compliance de SST — cobre os elementos centrais da NR‑01 (Gerenciamento de Riscos Ocupacionais / PGR) e da ISO 45001:2018 (cláusulas 4 a 10). Não substitui a análise técnica de um profissional habilitado nem a elaboração formal dos documentos legais (PGR, PCMSO, LTCAT, PCMAT, laudos técnicos etc.), que devem ser assinados por responsável técnico competente.</div>
  `;
}

    <div class="card">
      <div class="ui" style="font-weight:700;">Taxa de Frequência (TF)</div>
      <div class="value mono" style="font-size:1.6rem; margin:6px 0;">${co.tf}</div>
      ${sparkSVG(co.trend.tf,'var(--red-600)',160,36)}
      <p class="footnote" style="margin-top:8px; border:none; padding:0;">TF = (nº acidentes com afastamento × 1.000.000) / HHT</p>
    </div>
    <div class="card">
      <div class="ui" style="font-weight:700;">Taxa de Gravidade (TG)</div>
      <div class="value mono" style="font-size:1.6rem; margin:6px 0;">${co.tg}</div>
      ${sparkSVG(co.trend.tg,'var(--amber-600)',160,36)}
      <p class="footnote" style="margin-top:8px; border:none; padding:0;">TG = (dias perdidos/debitados × 1.000.000) / HHT</p>
    </div>
    <div class="card">
      <div class="ui" style="font-weight:700;">Score geral de compliance</div>
      <div class="value mono" style="font-size:1.6rem; margin:6px 0;">${k.overall}%</div>
      ${sparkSVG(co.trend.score,'var(--teal-600)',160,36)}
      <p class="footnote" style="margin-top:8px; border:none; padding:0;">Média ponderada: GRO, ISO 45001, Documentos, Treinamentos, Ações no prazo.</p>
    </div>
  </div>

  <h2 class="sec">Demais indicadores</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Indicador</th><th>Fórmula / definição</th><th>Valor</th></tr></thead>
      <tbody>
        <tr><td>Conformidade GRO/PGR</td><td>GHEs com status "Controlado" / total de GHEs</td><td class="code">${k.groScore}%</td></tr>
        <tr><td>Maturidade ISO 45001</td><td>Média das notas das cláusulas 4 a 10</td><td class="code">${k.isoScore}%</td></tr>
        <tr><td>Conformidade documental</td><td>Documentos válidos / total de documentos obrigatórios</td><td class="code">${k.docsScore}%</td></tr>
        <tr><td>Cobertura de treinamentos</td><td>Média de (concluídos / necessários) por treinamento</td><td class="code">${k.trainingScore}%</td></tr>
        <tr><td>Ações no prazo</td><td>Ações do plano não atrasadas / total de ações</td><td class="code">${k.actionsOnTime}%</td></tr>
        <tr><td>NC abertas / atrasadas</td><td>Contagem de não conformidades por status e prazo</td><td class="code">${k.ncOpen} / ${k.ncOverdue}</td></tr>
        <tr><td>Riscos críticos abertos</td><td>GHE classificado Alto/Crítico sem controle implementado</td><td class="code">${k.ghesOpen}</td></tr>
        <tr><td>ASO em dia</td><td>Colaboradores com ASO válido / total (integração RH/eSocial)</td><td class="code">${co.asoCompliance}%</td></tr>
        <tr><td>EPI conforme</td><td>Fichas de entrega assinadas com CA válido / total</td><td class="code">${co.epiCompliance}%</td></tr>
      </tbody>
    </table>
  </div>
  `;
}

const VIEWS = { overview:viewOverview, settings:viewSettings, dashboard:viewDashboard, gro:viewGRO, iso:viewISO, docs:viewDocs, nc:viewNC, audits:viewAudits, training:viewTraining, kpis:viewKPIs };
const COMPANY_SCOPED = new Set(['dashboard','gro','iso','docs','nc','audits','training','kpis']);

/* ============================= RENDER / EVENTOS ============================= */
function render(){
  document.querySelectorAll('.side-link').forEach(b=> b.classList.toggle('active', b.dataset.view===state.view));
  const content = document.getElementById('content');
  content.innerHTML = `<div class="view active">${VIEWS[state.view]()}</div>`;

  const wrap = document.getElementById('companySwitcherWrap');
  wrap.style.opacity = COMPANY_SCOPED.has(state.view) ? '1' : '.45';

  refreshCompanySelect();
  window.scrollTo(0,0);
}

function refreshCompanySelect(){
  const sel = document.getElementById('companySelect');
  sel.innerHTML = DB.companies.map(c=>`<option value="${c.id}" ${c.id===DB.activeCompany?'selected':''}>${esc(c.name)}</option>`).join('');
}

document.getElementById('companySelect').addEventListener('change', e=>{
  DB.activeCompany = e.target.value; save();
  if(!COMPANY_SCOPED.has(state.view)) state.view = 'dashboard';
  render();
});

document.getElementById('sidebar').addEventListener('click', e=>{
  const btn = e.target.closest('.side-link'); if(!btn) return;
  state.view = btn.dataset.view; render();
  document.getElementById('sidebar').classList.remove('open');
});

document.getElementById('menuBtn').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));

document.getElementById('addCoBtn').addEventListener('click', ()=>{
  const name = prompt('Nome da nova empresa-cliente:');
  if(!name) return;
  const sector = prompt('Setor de atividade:', 'Serviços') || 'Serviços';
  const nr4 = parseInt(prompt('Grau de risco (NR‑4, 1 a 4):', '2'), 10) || 2;
  const employees = parseInt(prompt('Nº de colaboradores:', '20'), 10) || 20;
  const c = company({
    id:uid('c'), name, cnpj:'—', sector, nr4, employees, tf:0, tg:0, asoCompliance:0, epiCompliance:0, legalCompliance:0, hht: employees*2000,
    ghes:[], actionPlan:[], iso:{4:0,5:0,6:0,7:0,8:0,9:0,10:0}, legal:[], objectives:[], documents:[], ncs:[], audits:[], trainings:[],
    trend:{score:[0,0,0,0,0,0], tf:[0,0,0,0,0,0], tg:[0,0,0,0,0,0]}
  });
  DB.companies.push(c); DB.activeCompany = c.id; save();
  state.view = 'dashboard'; render();
});

document.getElementById('themeBtn').addEventListener('click', ()=>{
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : cur==='light' ? null : 'dark';
  if(next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
  try{ localStorage.setItem('sst_suite_theme', next||''); }catch(e){}
});
(function initTheme(){
  try{ const t = localStorage.getItem('sst_suite_theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
})();

document.getElementById('content').addEventListener('click', e=>{
  const goto = e.target.closest('[data-goto-company]');
  if(goto){ DB.activeCompany = goto.dataset.gotoCompany; save(); state.view='dashboard'; render(); return; }
  if(e.target.id === 'resetDemoBtn'){ resetDemo(); return; }
});

document.getElementById('content').addEventListener('change', e=>{
  const actId = e.target.dataset.actionStatus;
  if(actId){
    const co = activeCo(); const a = co.actionPlan.find(x=>x.id===actId);
    if(a){ a.status = e.target.value; if(a.status!=='Atrasado' && a.due<0 && a.status!=='Concluído') { /* mantém prazo real, status manual pode divergir do prazo */ } save(); render(); }
    return;
  }
  const ncId = e.target.dataset.ncStatus;
  if(ncId){
    const co = activeCo(); const n = co.ncs.find(x=>x.id===ncId);
    if(n){ n.status = e.target.value; save(); render(); }
    return;
  }
});

/* init */
render();
</script>
</body>
</html>
